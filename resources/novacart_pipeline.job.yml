# One job = the whole pipeline: verify -> bronze -> silver -> gold -> data quality gate.
# Runs on serverless jobs compute (no task cluster defined), so nothing stays on between runs.
resources:
  jobs:
    novacart_pipeline:
      name: novacart-medallion-pipeline
      description: NovaCart PoC - raw files in the UC volume to Gold tables, with a data-quality gate.
      tags:
        project: dpe-azure-poc
        owner: ${var.owner}
      max_concurrent_runs: 1
      timeout_seconds: 3600

      # Job parameters are passed to every notebook as widget values.
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: volume
          default: ${var.volume}
        - name: batch_id
          default: "{{job.run_id}}"
        - name: force_reload
          default: "false"
        - name: revenue_tolerance_usd
          default: "0.01"

      # Daily run, kept PAUSED (cost rule). Use "Run now" for the demo, or unpause if needed.
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: Asia/Dhaka
        pause_status: PAUSED

      # Optional for the live demo: start the job automatically when a file lands in raw/.
      # trigger:
      #   pause_status: UNPAUSED
      #   file_arrival:
      #     url: /Volumes/${var.catalog}/${var.schema}/${var.volume}/raw/

      tasks:
        - task_key: verify_access
          notebook_task:
            notebook_path: ../notebooks/00_verify_access.py
        - task_key: ingest_bronze
          depends_on: [{task_key: verify_access}]
          notebook_task:
            notebook_path: ../notebooks/01_ingest_bronze.py
        - task_key: transform_silver
          depends_on: [{task_key: ingest_bronze}]
          notebook_task:
            notebook_path: ../notebooks/02_transform_silver.py
        - task_key: build_gold
          depends_on: [{task_key: transform_silver}]
          notebook_task:
            notebook_path: ../notebooks/03_build_gold.py
        - task_key: validate_quality
          depends_on: [{task_key: build_gold}]
          notebook_task:
            notebook_path: ../notebooks/04_validate_quality.py
